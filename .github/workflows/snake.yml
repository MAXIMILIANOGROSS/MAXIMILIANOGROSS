name: contribution-snake
on:
  schedule: [{cron: "17 3 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
concurrency: {group: profile-writes, cancel-in-progress: false}
jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk/svg-only@v3
        env:
          GITHUB_TOKEN: ${{ secrets.SNAKE_TOKEN || github.token }}
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/generated/snake.svg
            assets/generated/snake-dark.svg?palette=github-dark&color_dots=#0d2a3a,#0a6c8a,#00a8cc,#00d4ff,#7cecff
      - name: Commit snake
        run: |
          git config user.name "profile-bot"; git config user.email "profile-bot@users.noreply.github.com"
          git add assets/generated/snake*.svg
          git diff --cached --quiet || (git commit -m "chore: update contribution snake" && git pull --rebase -q && git push)
