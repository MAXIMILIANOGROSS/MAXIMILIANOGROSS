name: profile-dashboard
on:
  schedule: [{cron: "47 4 * * *"}]
  workflow_dispatch:
  push:
    paths: ["data/projects.json", "templates/**", "scripts/build.py", "scripts/i18n.py"]
permissions:
  contents: write
concurrency: {group: profile-writes, cancel-in-progress: false}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Fetch real repo data
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: python3 scripts/fetch_data.py
      - run: python3 scripts/build.py
      - run: pip install pyyaml && python3 scripts/validate.py
      - name: Commit if changed
        run: |
          git config user.name "profile-bot"; git config user.email "profile-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "chore: refresh profile dashboard" && git pull --rebase -q && git push)
